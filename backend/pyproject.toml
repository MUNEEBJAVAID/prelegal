[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API server (FastAPI)"
authors = [
    { name = "MUNEEBJAVAID", email = "90055157+MUNEEBJAVAID@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "litellm>=1.111.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prelegal-backend = "prelegal_backend:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Raised by pydantic while importing litellm's own types; not actionable here.
    "ignore:Items? .* (is|are) using the `ReadOnly` qualifier:UserWarning",
]
